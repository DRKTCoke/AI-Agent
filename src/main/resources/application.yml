server:
  port: 8080

spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}

app:
  chat:
    mock: ${CHAT_MOCK:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
